<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kiraan Loan Kenderaan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e9ebef;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;max-width:1413px}
canvas{display:block;width:100%;height:auto;background:#fff}
.controls{background:#fff;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.controls .full{grid-column:1/-1}
.controls label{display:block;font-size:12px;font-weight:700;color:#555}
.controls input,.controls select{width:100%;margin-top:5px;padding:11px;border:1px solid #d5d9e0;border-radius:9px;background:#fff;font-size:15px}
.status{background:#fff;padding:0 12px 12px;font-size:12px;color:#555}
.error{color:#b00020}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<canvas id="poster" width="1413" height="1871"></canvas>

<div id="controls" class="controls hidden">
  <div class="full">
    <label>Pilih Model</label>
    <select id="model"></select>
  </div>
  <div>
    <label>Rebate</label>
    <input id="rebate" value="0" inputmode="numeric">
  </div>
  <div>
    <label>Kadar Faedah (%)</label>
    <input id="rate" value="2.55" inputmode="decimal">
  </div>
</div>
<div id="status" class="status">Memuatkan...</div>
</div>

<script>
const SUPABASE_URL = "https://kncyrnxcnugsqffbyzxn.supabase.co";
const SUPABASE_KEY = "sb_publishable_He_P3in2xYLHzYi1l9cvRQ_VUWlXUEp";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DATA = {models:[], profile:null, settings:null};
const canvas = document.getElementById("poster");
const ctx = canvas.getContext("2d");
const base = new Image();

const $ = id => document.getElementById(id);
const money = n => "RM" + Math.round(Number(n)||0).toLocaleString("en-MY");
const num = v => Number(String(v).replace(/[^0-9.-]/g,"")) || 0;
const monthly = (loan, rate, years) => loan * (1 + (rate/100) * years) / (years * 12);

function write(text, x, y, font, color="#111", align="left") {
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = "alphabetic";
  ctx.fillText(String(text ?? ""), x, y);
}

function drawCar(url) {
  if (!url) return;
  const img = new Image();
  img.onload = () => {
    // Empty car area in the supplied PNG.
    ctx.drawImage(img, 130, 180, 1150, 500);
  };
  img.src = url;
}

function drawAgentPhoto(url) {
  if (!url) return;
  const img = new Image();
  img.onload = () => {
    ctx.save();
    ctx.beginPath();
    ctx.arc(846, 874, 108, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, 738, 766, 216, 216);
    ctx.restore();
  };
  img.src = url;
}

function render() {
  const m = DATA.models.find(x => x.id === $("model").value) || DATA.models[0];
  if (!m || !DATA.profile || !DATA.settings) return;

  const rebate = num($("rebate").value);
  const rate = num($("rate").value);
  const down = Number(DATA.settings.downpayment) || 0;

  const price = Number(m.price) || 0;
  const insurance = Number(m.insurance) || 0;
  const loan = Math.max(0, price + insurance - rebate - down);

  const p9 = monthly(loan, rate, 9);
  const p7 = monthly(loan, rate, 7);
  const p5 = monthly(loan, rate, 5);
  const lowest = Math.min(p9, p7, p5);

  // 1. Draw the supplied PNG exactly as-is.
  ctx.clearRect(0, 0, 1413, 1871);
  ctx.drawImage(base, 0, 0, 1413, 1871);

  // 2. Dynamic model title.
  write(m.model, 78, 164, "700 70px Arial", "#07164a");

  // 3. Monthly lowest amount.
  write("RM", 150, 883, "700 50px Arial", "#c90000");
  write(Math.round(lowest).toLocaleString("en-MY"), 285, 883, "800 112px Arial", "#c90000");
  write("/sebulan", 535, 894, "17px Arial", "#111");

  // 4. Agent profile.
  write(DATA.profile.full_name || "", 947, 846, "700 34px Arial", "#111");
  write(DATA.profile.role_name || "", 947, 881, "18px Arial", "#111");

  const tag = String(DATA.profile.tag_line || "").split("|");
  write(tag[0] || "", 947, 916, "700 18px Arial", "#a5191b");
  write(tag[1] || "", 947, 943, "700 18px Arial", "#a5191b");

  // 5. Table values.
  write(money(price), 1230, 1043, "700 25px Arial", "#111", "right");
  write(money(rebate), 1230, 1102, "700 25px Arial", "#111", "right");
  write(money(down), 1230, 1161, "700 25px Arial", "#111", "right");
  write(money(insurance), 1230, 1221, "700 25px Arial", "#111", "right");
  write(money(loan), 1230, 1280, "700 25px Arial", "#111", "right");
  write(rate.toFixed(2) + "%", 1230, 1340, "700 25px Arial", "#111", "right");

  // 6. Tenure payments.
  write("RM" + Math.round(p9).toLocaleString("en-MY"), 760, 1450, "700 34px Arial", "#c51a46", "center");
  write("/bulan", 875, 1450, "17px Arial", "#111", "left");

  write("RM" + Math.round(p7).toLocaleString("en-MY"), 760, 1531, "700 34px Arial", "#c51a46", "center");
  write("/bulan", 875, 1531, "17px Arial", "#111", "left");

  write("RM" + Math.round(p5).toLocaleString("en-MY"), 760, 1612, "700 34px Arial", "#c51a46", "center");
  write("/bulan", 875, 1612, "17px Arial", "#111", "left");

  // 7. WhatsApp number.
  write(DATA.profile.whatsapp || "", 1110, 1802, "700 52px Arial", "#fff", "center");

  // 8. Images are added last so they sit inside their empty placeholders.
  drawCar(m.image_url);
  drawAgentPhoto(DATA.profile.photo_url);
}

async function loadData() {
  $("status").textContent = "Menyemak akaun...";

  const {data:{user}, error:userError} = await sb.auth.getUser();
  if (userError) throw userError;

  if (!user) {
    $("status").textContent = "Sila login dahulu.";
    return;
  }

  const [modelsRes, profileRes, settingsRes] = await Promise.all([
    sb.from("car_models")
      .select("id,model,price,insurance,image_url,is_active,sort_order")
      .eq("is_active", true)
      .order("sort_order", {ascending:true})
      .order("model", {ascending:true}),

    sb.from("profiles")
      .select("id,full_name,photo_url,role_name,tag_line,whatsapp")
      .eq("id", user.id)
      .single(),

    sb.from("calculator_settings")
      .select("user_id,downpayment")
      .eq("user_id", user.id)
      .single()
  ]);

  if (modelsRes.error) throw modelsRes.error;
  if (profileRes.error) throw profileRes.error;
  if (settingsRes.error) throw settingsRes.error;

  DATA.models = modelsRes.data || [];
  DATA.profile = profileRes.data;
  DATA.settings = settingsRes.data;

  if (!DATA.models.length) {
    $("status").textContent = "Tiada model aktif dalam database.";
    return;
  }

  $("model").innerHTML = DATA.models
    .map(m => `<option value="${m.id}">${m.model}</option>`)
    .join("");

  $("controls").classList.remove("hidden");
  $("status").textContent = "Log masuk sebagai " + (DATA.profile.full_name || user.email || "User");

  render();
}

$("model").addEventListener("change", render);
$("rebate").addEventListener("input", render);
$("rate").addEventListener("input", render);

base.onload = () => {
  loadData().catch(err => {
    console.error(err);
    $("status").innerHTML = '<span class="error">Ralat: ' + (err.message || err) + '</span>';
  });
};
