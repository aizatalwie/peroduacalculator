<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiraan Loan Kenderaan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#e9ebef;font-family:Arial,Helvetica,sans-serif}
body{display:flex;justify-content:center}
.app{width:100%;max-width:896px}
canvas{display:block;width:100%;height:auto;background:#fff}
.toolbar{background:#fff;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toolbar label{font:700 12px Arial;color:#555}
.toolbar input,.toolbar select{width:100%;margin-top:5px;padding:10px;border:1px solid #d7dce5;border-radius:9px;font:14px Arial;background:#fff}
.full{grid-column:1/-1}
.status{font:12px Arial;color:#555;padding:0 12px 12px;background:#fff}
.error{color:#b00020}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
<canvas id="poster" width="896" height="1184"></canvas>
<div id="toolbar" class="toolbar hidden">
  <div class="full"><label>Model</label><select id="model"></select></div>
  <div><label>Rebate</label><input id="rebate" value="0" inputmode="numeric"></div>
  <div><label>Kadar Faedah (%)</label><input id="rate" value="2.55" inputmode="decimal"></div>
</div>
<div id="status" class="status">Memuatkan...</div>
</div>

<script>
const SUPABASE_URL = "https://kncyrnxcnugsqffbyzxn.supabase.co";
const SUPABASE_KEY = "sb_publishable_He_P3in2xYLHzYi1l9cvRQ_VUWlXUEp";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DATA = {models:[],profile:null,settings:null};
const canvas=document.getElementById("poster"), ctx=canvas.getContext("2d");
const base=new Image();
const $=id=>document.getElementById(id);
const money=n=>"RM"+Math.round(Number(n)||0).toLocaleString("en-MY");
const num=v=>Number(String(v).replace(/[^0-9.-]/g,""))||0;
const monthly=(loan,rate,years)=>loan*(1+(rate/100)*years)/(years*12);

function text(v,x,y,font,color="#111",align="left"){
  ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline="alphabetic";ctx.fillText(v,x,y);
}

function drawPhoto(url){
  if(!url)return;
  const p=new Image();
  p.onload=()=>{ctx.save();ctx.beginPath();ctx.arc(538,560,69,0,Math.PI*2);ctx.clip();ctx.drawImage(p,469,491,138,138);ctx.restore();};
  p.src=url;
}

function drawCar(url){
  if(!url)return;
  const c=new Image();
  c.onload=()=>ctx.drawImage(c,105,112,686,270);
  c.src=url;
}

function draw(){
  const m=DATA.models.find(x=>x.id===$("model").value)||DATA.models[0];
  if(!m||!DATA.profile||!DATA.settings)return;

  const rebate=num($("rebate").value), rate=num($("rate").value);
  const down=Number(DATA.settings.downpayment)||0;
  const price=Number(m.price)||0, insurance=Number(m.insurance)||0;
  const loan=Math.max(0,price+insurance-rebate-down);
  const p9=monthly(loan,rate,9),p7=monthly(loan,rate,7),p5=monthly(loan,rate,5);
  const low=Math.min(p9,p7,p5);

  ctx.clearRect(0,0,896,1184);
  ctx.drawImage(base,0,0,896,1184);

  text(m.model,38,103,"700 61px Arial","#07164a");
  text("RM",160,582,"700 40px Arial","#c90000");
  text(Math.round(low).toLocaleString("en-MY"),228,582,"800 78px Arial","#c90000");
  text("/sebulan",376,600,"13px Arial");

  text(DATA.profile.full_name||"",620,536,"700 27px Arial");
  text(DATA.profile.role_name||"",620,572,"14px Arial");
  const tag=String(DATA.profile.tag_line||"").split("|");
  text(tag[0]||"",620,605,"700 14px Arial","#a5191b");
  text(tag[1]||"",620,624,"700 14px Arial","#a5191b");

  text(money(price),832,696,"700 20px Arial","#111","right");
  text(money(rebate),832,735,"700 20px Arial","#111","right");
  text(money(down),832,774,"700 20px Arial","#111","right");
  text(money(insurance),832,813,"700 20px Arial","#111","right");
  text(money(loan),832,852,"700 20px Arial","#111","right");
  text(rate.toFixed(2)+"%",832,891,"700 20px Arial","#111","right");

  text("RM"+Math.round(p9).toLocaleString("en-MY"),550,956,"700 26px Arial","#a51618","center");
  text("/bulan",600,956,"14px Arial");
  text("RM"+Math.round(p7).toLocaleString("en-MY"),550,1009,"700 26px Arial","#a51618","center");
  text("/bulan",600,1009,"14px Arial");
  text("RM"+Math.round(p5).toLocaleString("en-MY"),550,1062,"700 26px Arial","#a51618","center");
  text("/bulan",600,1062,"14px Arial");

  text(DATA.profile.whatsapp||"",685,1162,"700 45px Arial","#fff","center");

  drawCar(m.image_url);
  drawPhoto(DATA.profile.photo_url);
}

async function loadData(){
  $("status").textContent="Menyemak akaun...";
  const {data:{user},error:userError}=await sb.auth.getUser();
  if(userError)throw userError;
  if(!user){ $("status").textContent="Sila login dahulu."; return; }

  const [models,profile,settings]=await Promise.all([
    sb.from("car_models").select("id,model,price,insurance,image_url,is_active,sort_order").eq("is_active",true).order("sort_order").order("model"),
    sb.from("profiles").select("id,full_name,photo_url,role_name,tag_line,whatsapp").eq("id",user.id).single(),
    sb.from("calculator_settings").select("user_id,downpayment").eq("user_id",user.id).single()
  ]);

  if(models.error)throw models.error;
  if(profile.error)throw profile.error;
  if(settings.error)throw settings.error;

  DATA.models=models.data||[];
  DATA.profile=profile.data;
  DATA.settings=settings.data;

  if(!DATA.models.length){$("status").textContent="Tiada model aktif.";return;}

  $("model").innerHTML=DATA.models.map(m=>`<option value="${m.id}">${m.model}</option>`).join("");
  $("toolbar").classList.remove("hidden");
  $("status").textContent="Log masuk sebagai "+(DATA.profile.full_name||user.email||"User");
  draw();
}

$("model").onchange=draw;
$("rebate").oninput=draw;
$("rate").oninput=draw;
$("rebate").onfocus=()=>{$("rebate").value=num($("rebate").value)||""};
$("rebate").onblur=()=>{$("rebate").value=money(num($("rebate").value));draw()};
$("rate").onfocus=()=>{$("rate").value=num($("rate").value)||""};
$("rate").onblur=()=>{$("rate").value=num($("rate").value).toFixed(2);draw()};

base.onload=()=>loadData().catch(e=>{$("status").innerHTML='<span class="error">Ralat: '+(e.message||e)+'</span>';});
